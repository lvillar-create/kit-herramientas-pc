  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ans-serif; -webkit-font-smoothing:antialiased; background:#f4f1ee; color:#23303a; }\n    h1,h2,h3 { letter-spacing:-.02em; }\n    a { text-decoration:none; color:inherit; }\n    section { scroll-margin-top:78px; }\n    @keyframes ovfade { from { opacity:0; } to { opacity:1; } }\n    @keyframes sheetin { from { opacity:0; transform:translateY(18px) scale(.99); } to { opacity:1; transform:none; } }\n    @keyframes bootpulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.75; transform:scale(.94); } }\n    .ov { animation:ovfade .18s ease; }\n    .ov2 { animation:ovfade .18s ease; }\n    .sheet { animation:sheetin .24s cubic-bezier(.2,.7,.3,1); }\n    .adpanel { animation:sheetin .24s cubic-bezier(.2,.7,.3,1); }\n    textarea::placeholder { color:#b3bac1; }\n    @media (max-width:880px){ .hero-deco{ display:none !important; } }\n    @media (max-width:720px){\n      .navlinks{ flex:1 1 0; min-width:0; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; justify-content:flex-end; gap:6px !important; }\n      .navlinks::-webkit-scrollbar{ display:none; }\n      .navlinks a{ font-size:.8rem !important; padding:7px 13px !important; white-space:nowrap; background:#82378C12 !important; color:#82378C !important; font-weight:700 !important; }\n      .brand span:last-child{ font-size:1.06rem !important; }\n      .hero-inner{ padding:46px 22px 52px !important; }\n      .hero-cta{ flex-direction:column; align-items:stretch !important; gap:11px !important; margin-top:28px !important; }\n      .hero-cta a{ width:100%; justify-content:center; font-size:1.02rem !important; padding:16px 22px !important; }\n      .sec{ padding-top:40px !important; padding-left:20px !important; padding-right:20px !important; }\n      .diag-card{ flex-direction:column; text-align:center; align-items:center !important; padding:30px 24px !important; gap:18px !important; }\n      .diag-card .diag-body{ min-width:0 !important; }\n      .diag-cta{ width:100%; justify-content:center; font-size:1rem !important; padding:15px 22px !important; }\n      .ov{ padding:14px 11px !important; }\n      .mhead{ padding:24px 22px 22px !important; }\n      .foro-card{ padding:32px 24px !important; }\n    }\n    .appbar{ display:none; }\n    @keyframes sheetup{ from{ transform:translateY(100%); } to{ transform:none; } }\n    @media (max-width:720px){\n      body{ padding-bottom:calc(66px + env(safe-area-inset-bottom)); }\n      header nav{ padding:11px 16px !important; gap:12px !important; }\n      .navlinks{ display:none !important; }\n      #top > div:last-child{ padding:32px 20px 34px !important; }\n      .cardgrid{ grid-template-columns:1fr !important; gap:16px !important; }\n      .toolcard{ min-height:0 !important; }\n      .appbar{\n        display:flex; position:fixed; left:0; right:0; bottom:0; z-index:90;\n        background:rgba(255,255,255,.95); backdrop-filter:blur(16px);\n        border-top:1px solid #e7e1d4; box-shadow:0 -6px 20px rgba(35,48,58,.06);\n        padding:7px 6px calc(7px + env(safe-area-inset-bottom));\n        justify-content:space-around; align-items:stretch; gap:2px;\n      }\n      .appbar > a, .appbar > button{\n        flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;\n        background:none; border:none; cursor:pointer; font-family:inherit;\n        color:#8a9199; font-size:10.5px; font-weight:700; padding:6px 2px; border-radius:14px;\n        -webkit-tap-highlight-color:transparent;\n      }\n      .appbar > a:active, .appbar > button:active{ background:#82378C10; }\n      .appbar svg{ width:23px; height:23px; }\n      .appbar > button{ color:#82378C; }\n      .ov, .ov2{ align-items:flex-end !important; padding:0 !important; overflow:hidden !important; }\n      .sheet, .adpanel{\n        max-width:100% !important; width:100% !important;\n        border-radius:22px 22px 0 0 !important;\n        max-height:92vh !important; margin:0 !important;\n        animation:sheetup .30s cubic-bezier(.2,.8,.25,1) !important;\n        display:flex !important; flex-direction:column !important;\n      }\n      .mhead, .ad-head{ flex-shrink:0; }\n      .sheet-body, .ad-body{\n        flex:1 1 auto !important; min-height:0 !important;\n        overflow-y:auto !important; -webkit-overflow-scrolling:touch;\n      }\n      .sheet::before, .adpanel::before{\n        content:\"\"; position:absolute; top:9px; left:50%; transform:translateX(-50%);\n        width:44px; height:5px; border-radius:999px; background:rgba(255,255,255,.55); z-index:8; pointer-events:none;\n      }\n    }\n    @media (max-width:420px){\n      .appbar > a, .appbar > button{ font-size:10px; }\n      .appbar svg{ width:22px; height:22px; }\n    }\n    @media print {\n      @page { margin:13mm; }\n      body { background:#fff !important; }\n      .index, .no-print { display:none !important; }\n      .ov { position:static !important; inset:auto !important; background:#fff !important; backdrop-filter:none !important; padding:0 !important; display:block !important; overflow:visible !important; animation:none !important; }\n      .ov2 { position:static !important; inset:auto !important; background:#fff !important; backdrop-filter:none !important; padding:0 !important; display:block !important; overflow:visible !important; animation:none !important; }\n      .sheet, .adpanel { max-width:100% !important; box-shadow:none !important; border-radius:0 !important; margin:0 !important; animation:none !important; }\n      .sheet-body { overflow:visible !important; }\n      textarea { min-height:60px !important; }\n      * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }\n    }\n  </style>\n</helmet>\n\n<div class=\"index\">\n\n  <sc-if value=\"{{ showBoot }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed; inset:0; z-index:9999; background:#faf9f5; display:flex; align-items:center; justify-content:center; transition:opacity .35s ease; opacity:{{ bootFading }};\">\n      <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"border-radius:18px; box-shadow:0 10px 30px rgba(35,48,58,.18); animation:bootpulse 1.1s ease-in-out infinite;\"><rect width=\"100\" height=\"100\" rx=\"22\" fill=\"#23303a\"></rect><rect x=\"26\" y=\"28\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#00a096\"></rect><rect x=\"52\" y=\"28\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#82378C\"></rect><circle cx=\"36\" cy=\"38\" r=\"3.4\" fill=\"#fff\"></circle><circle cx=\"62\" cy=\"38\" r=\"3.4\" fill=\"#fff\"></circle></svg>\n    </div>\n  </sc-if>\n\n  <header style=\"position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid #e7e1d4;\">\n    <nav style=\"max-width:1120px; margin:0 auto; padding:13px 24px; display:flex; align-items:center; gap:24px;\">\n      <a href=\"#top\" class=\"brand\" style=\"display:flex; align-items:center; gap:11px; flex-shrink:0;\">\n        <svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 100 100\" fill=\"none\" style=\"flex-shrink:0;\"><rect width=\"100\" height=\"100\" rx=\"22\" fill=\"#23303a\"></rect><rect x=\"26\" y=\"28\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#00a096\"></rect><rect x=\"52\" y=\"28\" width=\"20\" height=\"44\" rx=\"4\" fill=\"#82378C\"></rect><circle cx=\"36\" cy=\"38\" r=\"3.4\" fill=\"#fff\"></circle><circle cx=\"62\" cy=\"38\" r=\"3.4\" fill=\"#fff\"></circle></svg>\n        <span style=\"font-size:1.14rem; font-weight:800; letter-spacing:-.02em; line-height:1.05;\"><span style=\"color:#23303a;\">Herramientas</span> <span style=\"color:#82378C;\">para el aula</span></span>\n      </a>\n      <div class=\"navlinks\" style=\"margin-left:auto; display:flex; align-items:center; gap:8px;\">\n        <a href=\"#recursos\" style=\"font-size:.92rem; font-weight:600; color:#5b6770; padding:8px 13px; border-radius:999px;\" style-hover=\"background:#82378C12; color:#82378C;\">Autodiagnóstico</a>\n        <a href=\"#recursos\" style=\"font-size:.92rem; font-weight:600; color:#5b6770; padding:8px 13px; border-radius:999px;\" style-hover=\"background:#82378C12; color:#82378C;\">Herramientas</a>\n        <a href=\"#foro\" style=\"font-size:.92rem; font-weight:600; color:#5b6770; padding:8px 13px; border-radius:999px;\" style-hover=\"background:#82378C12; color:#82378C;\">Foro</a>\n      </div>\n    </nav>\n  </header>\n\n  <section id=\"top\" style=\"position:relative; overflow:hidden; background:#f4ecf7; border-bottom:1px solid #e6dcec;\">\n    <div style=\"position:absolute; right:-90px; top:-90px; width:280px; height:280px; border-radius:50%; background:#00a09612;\"></div>\n    <div style=\"position:absolute; right:52px; top:0; bottom:0; display:flex; align-items:center; gap:9px;\" class=\"hero-deco\">\n      <span style=\"width:16px; height:70px; border-radius:8px; background:#00a096;\"></span>\n      <span style=\"width:16px; height:104px; border-radius:8px; background:#82378C;\"></span>\n      <span style=\"width:16px; height:52px; border-radius:8px; background:#FFC800;\"></span>\n      <span style=\"width:16px; height:80px; border-radius:8px; background:#5AC8F0;\"></span>\n    </div>\n    <div style=\"position:relative; z-index:2; max-width:1120px; margin:0 auto; padding:44px 24px 40px;\">\n      <div style=\"max-width:660px;\">\n        <div style=\"display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:#82378C; background:#82378C12; padding:7px 14px; border-radius:999px;\"><i data-lucide=\"library\" style=\"width:14px; height:14px;\"></i>Repositorio</div>\n        <h1 style=\"font-size:clamp(2.2rem, 4.6vw, 3.2rem); font-weight:800; line-height:1.04; margin:16px 0 14px; color:#23303a;\">Herramientas para el aula</h1>\n        <p style=\"font-size:clamp(1.05rem, 2vw, 1.22rem); line-height:1.5; color:#5b6770; max-width:600px; margin-bottom:10px;\">Un espacio con recursos para enseñar <strong style=\"color:#82378C; font-weight:600;\">Pensamiento Computacional</strong>, fortaleciendo la participación y la confianza en el aula.</p>\n        <p style=\"font-size:clamp(1rem, 1.8vw, 1.12rem); line-height:1.5; color:#5b6770; max-width:600px;\">Empezá con un <strong style=\"color:#82378C; font-weight:600;\">autodiagnóstico</strong>, explorá las <strong style=\"color:#82378C; font-weight:600;\">tarjetas de herramientas</strong> y compartí tus experiencias con colegas en el <strong style=\"color:#82378C; font-weight:600;\">foro</strong>.</p>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"recursos\" class=\"sec\" style=\"max-width:1120px; margin:0 auto; padding:40px 24px 20px;\">\n\n    <div class=\"no-print\" style=\"display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:26px;\">\n      <span style=\"display:inline-flex; align-items:center; gap:7px; font-size:.8rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#9aa1a8; margin-right:4px;\"><i data-lucide=\"list-filter\" style=\"width:15px; height:15px;\"></i>Filtrar</span>\n      <sc-for list=\"{{ filterChips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ chip.set }}\" style=\"display:inline-flex; align-items:center; gap:8px; font-size:.9rem; font-weight:700; padding:9px 16px; border-radius:999px; cursor:pointer; font-family:inherit; background:{{ chip.bg }}; color:{{ chip.color }}; border:1.5px solid {{ chip.border }};\">\n          <span style=\"width:9px; height:9px; border-radius:999px; background:{{ chip.dot }};\"></span>{{ chip.label }}\n        </button>\n      </sc-for>\n    </div>\n\n    <sc-if value=\"{{ showAutodiag }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"diag-card\" style=\"position:relative; overflow:hidden; background:#faf6fb; border:1.5px solid #e7d9ea; border-radius:22px; padding:30px 34px; display:flex; align-items:center; gap:28px; flex-wrap:wrap; margin-bottom:26px;\">\n        <div style=\"position:absolute; left:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:#82378C0a;\"></div>\n        <div style=\"position:relative; z-index:2; width:72px; height:72px; flex-shrink:0; border-radius:20px; background:#82378C; display:flex; align-items:center; justify-content:center;\"><i data-lucide=\"compass\" style=\"width:34px; height:34px; color:#fff;\"></i></div>\n        <div class=\"diag-body\" style=\"position:relative; z-index:2; flex:1; min-width:260px;\">\n          <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:9px;\">\n            <span style=\"font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#82378C; background:#82378C18; padding:5px 11px; border-radius:999px;\">Autodiagnóstico</span>\n          </div>\n          <h2 style=\"font-size:1.42rem; font-weight:800; line-height:1.18; margin-bottom:8px; color:#23303a;\">Para empezar</h2>\n          <p style=\"font-size:1rem; line-height:1.5; color:#5b6770; max-width:560px;\">Antes de explorar las tarjetas, tomate unos minutos para <strong style=\"color:#82378C; font-weight:700;\">reflexionar sobre tu rol</strong> en las clases de Pensamiento Computacional. Son <strong style=\"color:#82378C; font-weight:700;\">6 preguntas</strong>, sin respuestas correctas o incorrectas.</p>\n        </div>\n        <button onclick=\"{{ startAd }}\" class=\"diag-cta\" style=\"position:relative; z-index:2; display:inline-flex; align-items:center; gap:9px; background:#82378C; color:#fff; border:none; font-size:.95rem; font-weight:800; padding:14px 22px; border-radius:999px; font-family:inherit; white-space:nowrap; cursor:pointer;\" style-hover=\"opacity:.92;\"><i data-lucide=\"arrow-right\" style=\"width:17px; height:17px;\"></i>{{ adCtaLabel }}</button>\n      </div>\n    </sc-if>\n\n    <div class=\"cardgrid\" style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:22px;\">\n      <sc-for list=\"{{ visibleTools }}\" as=\"tool\" hint-placeholder-count=\"6\">\n        <div onclick=\"{{ tool.open }}\" class=\"toolcard\" style=\"position:relative; overflow:hidden; cursor:pointer; background:{{ tool.color }}; border-radius:24px; display:flex; flex-direction:column; min-height:300px; color:#fff; box-shadow:0 12px 28px {{ tool.shadow }}; transition:transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform:translateY(-6px); box-shadow:0 26px 50px {{ tool.shadow }};\">\n          <div style=\"position:absolute; right:-70px; bottom:-90px; width:230px; height:230px; border-radius:50%; background:rgba(255,255,255,.09);\"></div>\n          <div style=\"position:absolute; right:18px; top:18px; font-size:4.2rem; font-weight:800; line-height:1; color:rgba(255,255,255,.16);\">{{ tool.n }}</div>\n          <span style=\"position:absolute; left:80px; top:26px; width:9px; height:9px; border-radius:999px; background:{{ tool.accent }};\"></span>\n          <span style=\"position:absolute; left:100px; top:46px; width:6px; height:6px; border-radius:999px; background:rgba(255,255,255,.5);\"></span>\n          <div style=\"position:relative; z-index:2; padding:24px 24px 22px; display:flex; flex-direction:column; gap:14px; flex:1;\">\n            <div style=\"width:62px; height:62px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.2);\"><i data-lucide=\"{{ tool.icon }}\" style=\"width:32px; height:32px; color:#fff;\"></i></div>\n            <div>\n              <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.92); margin-bottom:9px;\"><span style=\"width:6px; height:6px; border-radius:999px; background:{{ tool.accent }};\"></span>{{ tool.catLabel }}</span>\n              <h3 style=\"font-size:1.32rem; font-weight:800; line-height:1.16; color:#fff; margin-bottom:9px;\">{{ tool.title }}</h3>\n              <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600; color:rgba(255,255,255,.85); background:rgba(255,255,255,.14); padding:5px 11px; border-radius:999px;\"><i data-lucide=\"clock\" style=\"width:13px; height:13px;\"></i>{{ tool.momento }}</span>\n            </div>\n            <div>\n              <div style=\"font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.7); margin-bottom:8px;\">Qué vas a encontrar</div>\n              <div style=\"display:flex; flex-direction:column; gap:7px;\">\n                <sc-for list=\"{{ tool.encontras }}\" as=\"e\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex; gap:9px; align-items:flex-start;\"><i data-lucide=\"check\" style=\"width:15px; height:15px; flex-shrink:0; margin-top:2px; color:{{ tool.accent }};\"></i><span style=\"font-size:.9rem; line-height:1.4; color:rgba(255,255,255,.94);\">{{ e }}</span></div>\n                </sc-for>\n              </div>\n            </div>\n            <div onclick=\"{{ tool.open }}\" style=\"margin-top:auto; display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#fff; color:{{ tool.color }}; font-size:.95rem; font-weight:800; padding:13px 18px; border-radius:999px; box-shadow:0 6px 16px rgba(0,0,0,.12);\">Abrí la herramienta <i data-lucide=\"arrow-right\" style=\"width:17px; height:17px;\"></i></div>\n          </div>\n        </div>\n      </sc-for>\n    </div>\n  </section>\n\n  <section id=\"foro\" class=\"sec\" style=\"max-width:1120px; margin:0 auto; padding:54px 24px 60px;\">\n    <div class=\"foro-card\" style=\"position:relative; overflow:hidden; background:#00a096; color:#fff; border-radius:26px; padding:46px 44px;\">\n      <div style=\"position:absolute; right:-80px; bottom:-110px; width:280px; height:280px; border-radius:50%; background:rgba(255,255,255,.08);\"></div>\n      <div style=\"position:relative; z-index:2; display:flex; gap:36px; align-items:center; flex-wrap:wrap;\">\n        <div style=\"flex:1; min-width:280px;\">\n          <span style=\"display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.18); font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:999px;\"><i data-lucide=\"messages-square\" style=\"width:14px; height:14px;\"></i>Comunidad</span>\n          <h2 style=\"font-size:clamp(1.8rem, 3.2vw, 2.3rem); font-weight:800; line-height:1.1; margin:16px 0 12px;\">Compartí con tus colegas</h2>\n          <p style=\"font-size:1.08rem; line-height:1.55; color:rgba(255,255,255,.94); max-width:480px;\">Un espacio para <strong style=\"color:#fff; font-weight:800;\">intercambiar</strong> sobre el uso de las herramientas en clase.</p>\n          <div style=\"display:flex; flex-direction:column; gap:10px; margin:22px 0 26px;\">\n            <div style=\"display:flex; gap:10px; align-items:center;\"><i data-lucide=\"check-circle-2\" style=\"width:18px; height:18px; color:#CFF5DF;\"></i><span style=\"font-size:1rem; color:rgba(255,255,255,.95);\">Qué herramienta probaste y cómo te fue</span></div>\n            <div style=\"display:flex; gap:10px; align-items:center;\"><i data-lucide=\"check-circle-2\" style=\"width:18px; height:18px; color:#CFF5DF;\"></i><span style=\"font-size:1rem; color:rgba(255,255,255,.95);\">Qué observaste en la participación de tu grupo</span></div>\n            <div style=\"display:flex; gap:10px; align-items:center;\"><i data-lucide=\"check-circle-2\" style=\"width:18px; height:18px; color:#CFF5DF;\"></i><span style=\"font-size:1rem; color:rgba(255,255,255,.95);\">Qué te resultó y qué mejorarías</span></div>\n          </div>\n          <button type=\"button\" onclick=\"{{ openForo }}\" style=\"display:inline-flex; align-items:center; gap:10px; background:#fff; color:#00857c; font-size:1rem; font-weight:800; padding:15px 26px; bor margin-bottom:24px;\">\n            <sc-for list=\"{{ adRecs }}\" as=\"rec\" hint-placeholder-count=\"3\">\n              <div onclick=\"{{ rec.open }}\" style=\"display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; background:#faf8f4; border:1px solid #eee3ec; cursor:pointer;\" style-hover=\"background:#fff; border-color:{{ rec.color }};\">\n                <div style=\"width:46px; height:46px; flex-shrink:0; border-radius:13px; background:{{ rec.color }}; display:flex; align-items:center; justify-content:center;\"><i data-lucide=\"{{ rec.icon }}\" style=\"width:23px; height:23px; color:#fff;\"></i></div>\n                <div style=\"flex:1;\"><div style=\"font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:{{ rec.color }}; margin-bottom:2px;\">{{ rec.catLabel }}</div><div style=\"font-size:1rem; font-weight:700; line-height:1.2; color:#23303a;\">{{ rec.title }}</div></div>\n                <i data-lucide=\"arrow-right\" style=\"width:18px; height:18px; flex-shrink:0; color:{{ rec.color }};\"></i>\n              </div>\n            </sc-for>\n          </div>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; background:#faf8f4; border-radius:13px; padding:14px 16px; margin-bottom:24px;\">\n            <i data-lucide=\"info\" style=\"width:17px; height:17px; flex-shrink:0; margin-top:2px; color:#82378C;\"></i>\n            <p style=\"font-size:.9rem; line-height:1.5; color:#6b7280;\">{{ adCierre }}</p>\n          </div>\n          <div class=\"no-print\" style=\"display:flex; gap:11px; flex-wrap:wrap;\">\n            <button onclick=\"{{ saveAd }}\" style=\"flex:1; min-width:180px; display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#82378C; color:#fff; border:none; font-size:.95rem; font-weight:800; padding:14px 20px; border-radius:999px; cursor:pointer; font-family:inherit;\" style-hover=\"opacity:.92;\"><i data-lucide=\"download\" style=\"width:17px; height:17px;\"></i>Guardá tu devolución</button>\n            <button onclick=\"{{ restartAd }}\" style=\"display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#f1ece1; color:#5b6770; border:none; font-size:.95rem; font-weight:700; padding:14px 20px; border-radius:999px; cursor:pointer; font-family:inherit;\" style-hover=\"background:#e7e1d4;\"><i data-lucide=\"rotate-ccw\" style=\"width:17px; height:17px;\"></i>Repetir</button>\n            <button onclick=\"{{ goHerramientas }}\" style=\"display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#f1ece1; color:#5b6770; border:none; font-size:.95rem; font-weight:700; padding:14px 20px; border-radius:999px; cursor:pointer; font-family:inherit;\" style-hover=\"background:#e7e1d4;\"><i data-lucide=\"layout-grid\" style=\"width:17px; height:17px;\"></i>Ver todas las herramientas</button>\n          </div>\n        </div>\n      </sc-if>\n\n    </div>\n  </div>\n</sc-if>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  state = { open:null, checks:{}, radios:{}, texts:{}, dates:{}, adOpen:false, adStep:0, adAnswers:{}, fromAd:false, filter:\"all\", foroOpen:false, creaCopied:false, showBoot:true, bootFading:1 };\n\n  cats = {\n    obs: { label:\"Observación\", color:\"#00a096\" },\n    acc: { label:\"Acción\",      color:\"#82378C\" }\n  };\n\n  data = [\n    { cat:\"obs\", icon:\"eye\", title:\"Observar la participación\", slug:\"observa-la-participacion\",\n      desc:\"Prestando atención a quiénes participan, quiénes lideran y quiénes quedan en segundo plano.\",\n      momento:\"Durante la clase\",\n      encontras:[\"Preguntas guía para observar la dinámica\",\"Una ficha rápida para marcar al cierre\",\"Un espacio para compartir en el foro\"],\n      porqueLead:\"La participación no siempre se distribuye igual entre estudiantes.\",\n      porque:\"Observar estos patrones te ayuda a generar más oportunidades para que todas y todos desarrollen confianza y se involucren.\",\n      blocks:[\n        { kind:\"prompts\", icon:\"eye\", label:\"Durante la clase...\", items:[\n          \"¿Quiénes *participan más*? ¿Quiénes *participan menos*?\",\n          \"¿Quiénes *manejan la computadora* durante la actividad?\" ] },\n        { kind:\"checkgroups\", icon:\"check-square\", label:\"¿Qué observaste?\", groups:[\n          { title:\"Participación\", items:[\"Sí, predominaron los niños.\",\"Sí, predominaron las niñas.\",\"Participaron de forma pareja.\",{text:\"Noté otro tipo de patrón (¿cuál?)\",note:true}] },\n          { title:\"Uso de la computadora\", items:[\"Sí, predominaron los niños.\",\"Sí, predominaron las niñas.\",\"El uso fue parejo.\",{text:\"Noté otro tipo de patrón (¿cuál?)\",note:true}] } ] },\n        { kind:\"write\", icon:\"message-circle\", label:\"Para pensar\",\n          prompt:\"¿Algo de lo que observaste te llamó la atención?\" },\n        { kind:\"foro\", text:\"Te invitamos a compartir lo que observaste en el grupo de CREA y así como conocer experiencias de tus colegas.\" }\n      ] },\n\n    { cat:\"obs\", icon:\"message-square-quote\", title:\"Feedback que impulsa\", slug:\"feedback-que-impulsa\",\n      desc:\"¿Qué aspectos solés reconocer al dar devoluciones en clase.\",\n      momento:\"Al dar devoluciones\",\n      encontras:[\"Una autoevaluación de qué reconocés en clase\",\"Un espacio para tu reflexión\",\"Un espacio para compartir en el foro\"],\n      porqueLead:\"Las devoluciones que reciben las y los estudiantes influyen en cómo interpretan sus logros, dificultades y posibilidades de aprender.\",\n      porque:\"Cuando se centran en el proceso, ofrecen información para mejorar y favorecen que se animen a seguir intentando.\",\n      blocks:[\n        { kind:\"check\", icon:\"check-square\", label:\"Durante la clase, enfoqué mis devoluciones en…\", items:[\n          \"El *esfuerzo* o la persistencia.\",\n          \"Las *estrategias* o la forma de resolver.\",\n          \"Los *avances*, aunque sean pequeños.\",\n          \"Las *respuestas correctas* o el resultado final.\" ] },\n        { kind:\"write\", icon:\"message-circle\", label:\"Para pensar\",\n          prompt:\"¿Qué mensaje quiero que transmitan mis devoluciones?\" },\n        { kind:\"foro\", text:\"Te invitamos a sumarte a la conversación en el grupo de CREA y comentarlo con tus colegas.\" }\n      ] },\n\n    { cat:\"acc\", icon:\"users-round\", title:\"Estrategias para distribuir la participación\", slug:\"estrategias-distribuir-participacion\",\n      desc:\"Pequeños cambios antes de pedir respuestas pueden hacer que más estudiantes se animen a participar.\",\n      momento:\"En la coordinación con el DR\",\n      encontras:[\"Dos estrategias listas para proponer\",\"Un espacio para tu reflexión\",\"Un espacio para compartir en el foro\"],\n      porqueLead:\"Si pedís respuestas al instante, suelen participar siempre las mismas personas.\",\n      porque:\"Dar tiempo para pensar y anticipar la participación abre la oportunidad a más estudiantes.\",\n      blocks:[\n        { kind:\"strategies\", icon:\"lightbulb\", label:\"Dos estrategias para acordar con el docente remoto\", items:[\n          { n:\"1\", title:\"Pensá, conversá, compartí\",\n            steps:[\n              { t:\"Pensá\", d:\"30 segundos para pensar en forma individual.\" },\n              { t:\"Conversá\", d:\"1 minuto en parejas o pequeños grupos.\" },\n              { t:\"Compartí\", d:\"Invitá a compartir a estudiantes diferentes en cada actividad.\" }\n            ],\n            takeaway:\"Así más estudiantes preparan una respuesta antes de hablar en público.\" },\n          { n:\"2\", title:\"Aviso anticipado\",\n            quote:\"En unos minutos voy a pedir que algunas personas compartan qué piensan. Tómense un momento para prepararse.\",\n            takeaway:\"Anticipar la participación ayuda a que más personas se animen a intervenir.\" }\n        ] },\n        { kind:\"write\", icon:\"message-circle\", label:\"Para pensar\",\n          prompt:\"¿Qué idea vas a probar?\" },\n        { kind:\"foro\", text:\"Te invitamos a entrar al grupo de CREA para compartir tu experiencia y conocer qué se está probando en otras aulas.\" }\n      ] },\n\n    { cat:\"acc\", icon:\"languages\", title:\"Lenguaje inclusivo y no estereotipado\", slug:\"lenguaje-inclusivo\",\n      desc:\"Evitá reforzar asociaciones de género con las disciplinas STEM, en todo momento de la clase.\",\n      momento:\"En todo momento\",\n      encontras:[\"Una pregunta para reflexionar\",\"Reemplazos concretos para usar ya\",\"Una idea para acordar con el grupo\"],\n      porqueLead:\"El lenguaje también enseña.\",\n      stat:{ text:\"¿Sabías que cuando se le pide a estudiantes que dibujen a alguien que trabaja en ciencia, el **73%** dibuja a un varón?\", source:\"Fuente: Miller et al. (2018)\" },\n      revisa:{ label:\"Una pregunta para reflexionar\", text:\"¿El **lenguaje** y los **ejemplos** que usás en clase, son **inclusivos**?\" },\n      blocks:[\n        { kind:\"terms\", label:\"Probá estos reemplazos\", items:[\n          { antes:\"los alumnos\", despues:\"las y los estudiantes · el estudiantado\" },\n          { antes:\"niños\", despues:\"niñas y niños · el grupo\" },\n          { antes:\"los científicos\", despues:\"científicas y científicos\" },\n          { antes:\"bienvenidos\", despues:\"bienvenidas y bienvenidos\" }\n        ], foot:\"También podés construir con el grupo *acuerdos de convivencia* que incluyan el lenguaje inclusivo, y colocar un *cartel visible* con ejemplos concretos.\" },\n        { kind:\"write\", icon:\"handshake\", label:\"Para la próxima clase\",\n          prompt:\"¿Qué término o cambio vas a empezar a usar?\" },\n        { kind:\"foro\", text:\"Te invitamos a conocer qué términos están usando tus colegas y compartir los tuyos en el grupo de CREA.\" }\n      ] },\n\n    { cat:\"acc\", icon:\"shield-check\", title:\"Más confianza para enfrentar desafíos\", slug:\"mas-confianza\",\n      desc:\"Las dificultades y los errores son oportunidades para construir confianza en las propias capacidades.\",\n      momento:\"Ante un error o frustración\",\n      encontras:[\"Frases para acompañar el error\",\"Ideas para valorar la persistencia\",\"Un acuerdo para la próxima clase\"],\n      porqueLead:\"La forma en que acompañamos los errores hace una diferencia.\",\n      porque:[\n        \"Cuando equivocarse no da miedo, más estudiantes se animan a participar, probar ideas nuevas y seguir aprendiendo.\",\n        \"Esto beneficia a todo el grupo y además, **puede ser especialmente importante para las niñas, que suelen tener menos confianza en STEM que los niños**, aun cuando les va igual de bien.\"\n      ],\n      blocks:[\n        { kind:\"ideas\", icon:\"lightbulb\", label:\"Ideas para probar\", items:[\n          { label:\"Reconocer estrategias\", quote:\"Probaste *distintas opciones* hasta encontrar una solución.\" },\n          { label:\"Normalizar los errores\", quote:\"Equivocarse *también es parte de aprender*.\" },\n          { label:\"Valorar la persistencia\", quote:\"Seguiste *intentando* aunque era difícil.\" },\n          { label:\"Preguntar antes de resolver\", quote:\"¿Qué podrías *probar ahora*?\" }\n        ] },\n        { kind:\"write\", icon:\"handshake\", label:\"Acuerdo para la próxima clase\",\n          prompt:\"¿Qué mensaje o estrategia vas a incorporar, y en qué momento?\" },\n        { kind:\"foro\", text:\"Te invitamos a compartir tus vivencias con tus colegas en el grupo de CREA e inspirarte de sus estrategias.\" }\n      ] },\n\n    { cat:\"acc\", icon:\"shuffle\", title:\"Diversificar los roles\", slug:\"diversificar-los-roles\",\n      desc:\"Que todas y todos asuman por igual los diferentes roles y tareas en PC (organizar, programar, presentar, etc.).\",\n      momento:\"Al armar grupos\",\n      encontras:[\"Pasos para preparar los roles antes de empezar\",\"Acciones concretas durante la clase\",\"Un espacio para compartir en el foro\"],\n      porqueLead:\"Ciertos roles o tareas pueden recaer siempre en las mismas personas.\",\n      porque:[\n        \"Cuando estudiantes se organizan en equipos de trabajo por su cuenta, **es frecuente que las mismas personas asuman los mismos roles y tareas**.\",\n        \"*Por ejemplo, es común que los niños ocupen el rol de programar y que las niñas se encarguen de presentar el trabajo al resto del aula.*\",\n        \"**Esto no responde a diferencias de capacidad, sino a patrones** que se repiten sin que nos demos cuenta.\",\n        \"Por eso, **es importante que los roles roten** para que todos y todas puedan ganar confianza y desarrollar distintas habilidades.\"\n      ],\n      blocks:[\n        { kind:\"note\", label:\"Antes de empezar la actividad\", items:[\n          { icon:\"target\", text:\"¿Cuál será el *rol técnico principal*.\", sub:\"Por ejemplo: programar, manejar el dispositivo o construir.\" },\n          { icon:\"history\", text:\"*¿Quiénes ocuparon ese rol* en las últimas clases.\" },\n          { icon:\"layout-grid\", text:\"Preparar tarjetas para asignar los roles a *todo el equipo* para facilitar la distribución.\" } ] },\n        { kind:\"links\", label:\"Recurso para imprimir\", items:[\n          { icon:\"printer\", text:\"Podés descargar aquí las tarjetas de roles para recortar y repartir en el grupo\", href:\"Tarjetas de Roles.dc.html\" } ] },\n        { kind:\"check\", label:\"Durante la actividad\", items:[\n          \"Asignar el rol técnico a alguien que haya tenido *menos oportunidades* de desempeñarlo.\",\n          \"Puede ser de ayuda explicar que *todos los integrantes* del equipo irán teniendo la oportunidad de asumir ese rol en distintas clases.\" ] },\n        { kind:\"write\", icon:\"message-circle\", label:\"Para pensar\",\n          prompt:\"¿Qué pasó cuando organizaste los roles?\" },\n        { kind:\"foro\", text:\"Te invitamos a sumarte a la conversación en el foro y comentarlo ahí con tus colegas.\" }\n      ] }\n  ];\n\n  adData = [\n    { dim:\"obs\", label:\"Qué valorás\", q:\"¿Qué te parece más importante promover en el grupo durante una clase de Pensamiento Computacional?\",\n      opts:[ \"Que desarrollen habilidades para resolver desafíos.\",\n             \"Que se interesen y disfruten las actividades.\",\n             \"Que aprendan a trabajar colaborativamente.\",\n             \"Que tengan la oportunidad de asumir distintos roles y participar.\" ] },\n    { dim:\"obs\", label:\"Qué observás\", q:\"¿A qué solés prestar más atención durante las clases de Pensamiento Computacional?\",\n      opts:[ \"A cómo se organizan los equipos y se distribuyen roles y tareas.\",\n             \"A quiénes participan más y quiénes participan menos.\",\n             \"A que todos y todas logren completar la actividad propuesta.\",\n             \"A que todos y todas muestren interés y motivación.\" ] },\n    { dim:\"obs\", label:\"Diferencias en la participación\", q:\"Según tu experiencia, ¿cuál de estas situaciones explica mejor que algunas personas participen menos durante la clase de Pensamiento Computacional?\",\n      opts:[ \"Que tienen intereses diferentes y eso se refleja en su participación.\",\n             \"Que la dinámica del grupo puede favorecer que algunas participen más que otras.\",\n             \"Que tienen más experiencia o afinidad y se sienten más preparadas para participar.\",\n             \"Que los mensajes y expectativas que reciben fuera del aula influyen en su confianza para participar.\" ] },\n    { dim:\"acc\", label:\"Tu rol en el programa\", q:\"Pensando en tu rol durante las clases de Pensamiento Computacional, ¿cuál crees que es tu principal aporte dentro del programa?\",\n      opts:[ \"Mi principal aporte es acompañar aspectos organizativos de la clase.\",\n             \"Mi principal aporte es observar cómo participa el grupo y favorecer que todas las personas se involucren.\",\n             \"Mi principal aporte es planificar junto al docente remoto cómo organizar la participación y acompañar el aprendizaje del grupo.\",\n             \"Mi principal aporte es brindar apoyo a estudiantes cuando lo necesitan.\" ] },\n    { dim:\"acc\", label:\"Roles técnicos\", q:\"Si durante una actividad de programación en equipos observás que siempre son las mismas personas quienes usan el dispositivo, ¿qué creés que podría ayudar más?\",\n      opts:[ \"Conversar con el equipo para entender cómo se organizaron.\",\n             \"Animar a que prueben tareas diferentes.\",\n             \"Hablarlo en coordinación con tu Docente Remoto para planificar estrategias para diversificar los roles en la próxima clase.\",\n             \"Confiar en que el equipo puede resolverlo por su cuenta.\" ] },\n    { dim:\"acc\", label:\"Confianza\", q:\"Si una estudiante evita participar porque cree que “no es buena para Pensamiento Computacional”, ¿qué hacés?\",\n      opts:[ \"Ayudarla a reconocer avances o logros concretos que ya alcanzó.\",\n             \"Respetar su decisión y acompañarla desde el rol que prefiera asumir.\",\n             \"Animarla a intentarlo.\",\n             \"Generar oportunidades graduales para que gane confianza en ese tipo de tareas.\" ] }\n  ];\n\n  adProfiles = {\n    AA: {\n      msg:[ \"Tus respuestas sugieren que **ya prestás atención a cómo se distribuye la participación en el aula** — quiénes se involucran, quiénes quedan afuera, cómo se organizan los equipos.\",\n            \"Y que cuando notás algo, *tenés recursos para intervenir*.\",\n            \"Las herramientas del kit te ofrecen formas concretas de llevar lo que ya observás a pequeñas acciones dentro del aula.\" ],\n      recs:[5,1,2] },\n    BA: {\n      msg:[ \"Tus respuestas sugieren que **tenés disposición para acompañar a tus estudiantes y actuar cuando algo no funciona**.\",\n            \"Esa actitud es *el motor de cualquier cambio* en el aula.\",\n            \"Las herramientas del kit pueden ayudarte a conectar esa disposición con algunas dinámicas que a veces pasan desapercibidas — como quiénes asumen roles técnicos, quiénes piden ayuda en voz alta y quiénes prefieren no hacerlo.\" ],\n      recs:[0,1,4] },\n    AB: {\n      msg:[ \"Tus respuestas sugieren que **prestás atención a lo que pasa en el aula** — notás cómo se organizan los equipos, quiénes participan más y quiénes menos.\",\n            \"Esa capacidad de observación es *el primer paso para cualquier cambio*.\",\n            \"Las herramientas del kit proponen acciones concretas para transformar observaciones en pequeñas decisiones fáciles de aplicar dentro del aula.\" ],\n      recs:[2,4,5] },\n    BB: {\n      msg:[ \"Tus respuestas sugieren que **tu foco está puesto en acompañar a tus estudiantes en lo que necesitan momento a momento**.\",\n            \"Ese es un *punto de partida valioso para sumar nuevas formas de observar las dinámicas en el aula*.\",\n            \"Las herramientas del kit invitan a sumar una nueva mirada: prestar atención a algunas dinámicas de participación que pueden pasar desapercibidas, y probar pequeños cambios en su organización.\" ],\n      recs:[0,3,1] }\n  };\n  adCierre = \"El kit completo tiene 6 tarjetas — a lo largo de estos meses vas a ir recibiendo propuestas para explorarlas todas.\";\n\n  headerIcon(kind){\n    return ({ prompts:\"list\", check:\"check-square\", ideas:\"lightbulb\",\n      terms:\"replace\", note:\"info\", write:\"message-circle\",\n      checkgroups:\"check-square\", foro:\"messages-square\", strategies:\"lightbulb\" })[kind] || \"circle\";\n  }\n\n  componentDidMount(){\n    let savedAdAnswers = {};\n    try {\n      const s = JSON.parse(localStorage.getItem(\"aulaactiva\") || \"{}\");\n      savedAdAnswers = s.adAnswers || {};\n      this.setState({\n        checks: s.checks || {}, radios: s.radios || {},\n        texts: s.texts || {}, dates: s.dates || {}, adAnswers: savedAdAnswers\n      });\n    } catch(e){}\n    const hash = (window.location.hash || \"\").replace(\"#\",\"\");\n    if(hash === \"autodiagnostico\" || hash === \"autotest\"){\n      const done = Object.keys(savedAdAnswers).length >= 6;\n      this.setState({ adOpen:true, adStep: done ? 6 : 0 });\n    } else if(hash){\n      const idx = this.data.findIndex(t => t.slug === hash);\n      if(idx !== -1) this.setState({ open: idx });\n    }\n    this._icons();\n    setTimeout(() => {\n      this.setState({ bootFading:0 });\n      setTimeout(() => this.setState({ showBoot:false }), 380);\n    }, 420);\n  }\n  componentDidUpdate(){ this._icons(); }\n  _icons(){\n    if(window.lucide && window.lucide.createIcons){ try { window.lucide.createIcons(); } catch(e){} }\n    else { setTimeout(()=>this._icons(), 120); }\n  }\n  persist(){\n    const { checks, radios, texts, dates, adAnswers } = this.state;\n    try { localStorage.setItem(\"aulaactiva\", JSON.stringify({ checks, radios, texts, dates, adAnswers })); } catch(e){}\n  }\n  setCheck(k){ this.setState(s => ({ checks:{ ...s.checks, [k]: !s.checks[k] } }), () => this.persist()); }\n  setRadio(k,v){ this.setState(s => ({ radios:{ ...s.radios, [k]: v } }), () => this.persist()); }\n  setText(k,v){ this.setState(s => ({ texts:{ ...s.texts, [k]: v } }), () => this.persist()); }\n  openTool(i, fromAd){\n    const slug = this.data[i].slug;\n    if(slug) window.location.hash = slug;\n    this.setState({ open:i, adOpen: fromAd ? false : this.state.adOpen, fromAd: !!fromAd });\n  }\n\n  rich(str, color){\n    if(str == null) return str;\n    const parts = String(str).split(/\\*([^*]+)\\*/g);\n    return React.createElement(React.Fragment, null, parts.map((p,i) =>\n      i % 2 === 1 ? React.createElement(\"strong\", { key:i, style:{ color, fontWeight:800 } }, p) : p\n    ));\n  }\n\n  richFull(str, boldColor){\n    if(str == null) return str;\n    const col = boldColor || \"#82378C\";\n    const nodes = [];\n    let key = 0;\n    String(str).split(/\\*\\*([^*]+)\\*\\*/g).forEach((seg, bi) => {\n      if(bi % 2 === 1){\n        nodes.push(React.createElement(\"strong\", { key:key++, style:{ color:col, fontWeight:800 } }, seg));\n      } else if(seg){\n        seg.split(/\\*([^*]+)\\*/g).forEach((s, ii) => {\n          if(ii % 2 === 1) nodes.push(React.createElement(\"em\", { key:key++, style:{ fontStyle:\"italic\", color:\"#8a929b\" } }, s));\n          else if(s) nodes.push(React.createElement(React.Fragment, { key:key++ }, s));\n        });\n      }\n    });\n    return React.createElement(React.Fragment, null, nodes);\n  }\n\n  // Q1 (idx0) y Q4 (idx3) son priming/autopercepción y no cuentan para el perfil.\n  // Por pregunta que sí cuenta, el set de letras (por índice 0=A..3=D) que \"activa\" esa dimensión:\n  adActivation = { 1:[2,3], 2:[2,3], 4:[0,1], 5:[1,3] };\n\n  computeProfile(){\n    const { adAnswers } = this.state;\n    let obs = 0, acc = 0;\n    Object.keys(this.adActivation).forEach(k => {\n      const qi = Number(k);\n      const a = adAnswers[qi];\n      if(a === undefined) return;\n      if(this.adActivation[qi].includes(a)){\n        if(this.adData[qi].dim === \"obs\") obs++; else acc++;\n      }\n    });\n    const obsHigh = obs >= 2, accHigh = acc >= 2;\n    const key = (obsHigh ? \"A\" : \"B\") + (accHigh ? \"A\" : \"B\");\n    return this.adProfiles[key];\n  }\n\n  computeRecs(){ return this.computeProfile().recs; }\n  recsMessage(){ return this.computeProfile().msg; }\n\n  renderVals(){\n    const { open, checks, radios, texts, adOpen, adStep, adAnswers, filter, showBoot, bootFading } = this.state;\n    const tint = (c) => c + \"14\";\n    const VIOLET = \"#82378C\";\n    const R = (s) => this.rich(s, open!=null ? this.cats[this.data[open].cat].color : \"#000\");\n\n    const hexShadow = (hex) => {\n      const h = hex.replace(\"#\",\"\"); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);\n      return `rgba(${r},${g},${b},.34)`;\n    };\n    const accents = [\"#FFC800\",\"#F09100\",\"#FFC800\",\"#50AF32\",\"#FFC800\",\"#5AC8F0\"];\n    const tools = this.data.map((t,i) => {\n      const c = this.cats[t.cat].color;\n      return { title:t.title, icon:t.icon, momento:t.momento, catKey:t.cat,\n        catLabel:this.cats[t.cat].label, color:c, tint:tint(c),\n        shadow:hexShadow(c), accent:accents[i % accents.length],\n        n:String(i+1).padStart(2,\"0\"),\n        encontras:t.encontras, open:() => this.openTool(i) };\n    });\n\n    const chipDefs = [\n      { key:\"all\",      label:\"Todo\",            dot:\"#5b6770\" },\n      { key:\"autodiag\", label:\"Autodiagnóstico\", dot:VIOLET },\n      { key:\"obs\",      label:\"Observación\",     dot:\"#00a096\" },\n      { key:\"acc\",      label:\"Acción\",          dot:VIOLET }\n    ];\n    const filterChips = chipDefs.map(cd => {\n      const on = filter === cd.key;\n      return { label:cd.label, dot:cd.dot, active:on,\n        bg: on ? \"#23303a\" : \"#fff\", color: on ? \"#fff\" : \"#5b6770\",\n        border: on ? \"#23303a\" : \"#e2dccf\",\n        set:() => this.setState({ filter:cd.key }) };\n    });\n    const showAutodiag = filter === \"all\" || filter === \"autodiag\";\n    const visibleTools = filter === \"all\" ? tools\n      : filter === \"autodiag\" ? []\n      : tools.filter(t => t.catKey === filter);\n\n    let active = {};\n    if(open !== null){\n      const t = this.data[open], color = this.cats[t.cat].color, tn = tint(color);\n      active = {\n        title:t.title, desc:t.desc, icon:t.icon, momento:t.momento,\n        catLabel:this.cats[t.cat].label, color, tint:tn, tintBorder:color+\"33\", fromAd:this.state.fromAd,\n        porqueLead: t.porqueLead ? this.richFull(t.porqueLead, color) : \"\",\n        porqueParas: (Array.isArray(t.porque) ? t.porque : (t.porque ? [t.porque] : [])).map(p => this.richFull(p, color)),\n        hasPorque: !!(t.porqueLead || t.stat || t.revisa || (t.porque && (Array.isArray(t.porque) ? t.porque.length : true))),\n        stat: t.stat ? { text: this.richFull(t.stat.text, color), source: t.stat.source } : null,\n        revisa: t.revisa ? { label: t.revisa.label, text: this.richFull(t.revisa.text, color) } : null,\n        blocks: t.blocks.map((b,bi) => {\n          const o = { label:b.label, hIcon:b.icon || this.headerIcon(b.kind),\n            isPrompts:b.kind===\"prompts\", isCheck:b.kind===\"check\",\n            isIdeas:b.kind===\"ideas\", isTerms:b.kind===\"terms\", isNote:b.kind===\"note\",\n            isWrite:b.kind===\"write\", isLinks:b.kind===\"links\",\n            isCheckgroups:b.kind===\"checkgroups\", isForo:b.kind===\"foro\", isStrategies:b.kind===\"strategies\" };\n          if(b.kind === \"prompts\"){ o.items = b.items.map(s => R(s)); }\n          else if(b.kind === \"check\"){\n            o.items = b.items.map((text,ii) => {\n              const key = open+\"-\"+bi+\"-\"+ii, ck = !!checks[key];\n              return { text:R(text), checked:ck, boxBg: ck ? color : \"#fff\", toggle:() => this.setCheck(key) };\n            });\n          }\n          else if(b.kind === \"checkgroups\"){\n            o.groups = b.groups.map((g,gi) => ({\n              title:g.title,\n              items:g.items.map((it,ii) => {\n                const isObj = typeof it === \"object\";\n                const label = isObj ? it.text : it;\n                const key = open+\"-\"+bi+\"-\"+gi+\"-\"+ii, ck = !!checks[key];\n                const noteKey = key+\"-note\";\n                return { text:R(label), checked:ck, boxBg: ck ? color : \"#fff\", toggle:() => this.setCheck(key),\n                  hasNote: !!(isObj && it.note), noteValue: texts[noteKey] || \"\",\n                  onNoteInput: (e) => this.setText(noteKey, e.target.value) };\n              })\n            }));\n          }\n          else if(b.kind === \"foro\"){ o.text = b.text; }\n          else if(b.kind === \"strategies\"){\n            o.items = b.items.map(it => ({\n              n:it.n, title:it.title, quote:it.quote || \"\", takeaway:it.takeaway || \"\",\n              hasSteps: !!(it.steps && it.steps.length),\n              steps: (it.steps || []).map(sp => ({ t:sp.t, d:sp.d })) }));\n          }\n          else if(b.kind === \"ideas\"){\n            o.items = b.items.map(it => ({ label:it.label, quote: it.quote ? R(it.quote) : \"\",\n              hasLines: !!(it.lines && it.lines.length), lines: (it.lines || []).map(l => R(l)), foot: it.foot ? R(it.foot) : \"\" }));\n          }\n          else if(b.kind === \"terms\"){ o.items = b.items; o.foot = b.foot ? R(b.foot) : \"\"; }\n          else if(b.kind === \"note\"){ o.items = b.items.map(it => ({ icon:it.icon, text:R(it.text), sub:it.sub || \"\" })); }\n          else if(b.kind === \"links\"){ o.items = b.items.map(it => ({ icon:it.icon, text:it.text, href:it.href })); }\n          else if(b.kind === \"write\"){\n            const key = open+\"-\"+bi;\n            o.prompt = b.prompt; o.value = texts[key] || \"\"; o.onInput = (e) => this.setText(key, e.target.value);\n          }\n          return o;\n        })\n      };\n    }\n\n    const adIsResults = adOpen && adStep >= 6;\n    const adIsQuestion = adOpen && adStep < 6;\n    let adQuestionText = \"\", adDimension = \"\", adOptions = [], adCanNext = false;\n    if(adIsQuestion){\n      const q = this.adData[adStep];\n      adQuestionText = q.q; adDimension = q.label;\n      const sel = adAnswers[adStep];\n      adCanNext = sel !== undefined;\n      const letters = [\"A\",\"B\",\"C\",\"D\"];\n      adOptions = q.opts.map((text,oi) => {\n        const isSel = sel === oi;\n        return { letter:letters[oi], text, selected:isSel,\n          border: isSel ? VIOLET : \"#e7e1d4\", bg: isSel ? VIOLET+\"0f\" : \"#fff\",\n          chipBg: isSel ? VIOLET : \"#f1ece1\", chipColor: isSel ? \"#fff\" : \"#9aa1a8\",\n          select:() => this.setState(s => ({ adAnswers:{ ...s.adAnswers, [adStep]: oi } }), () => this.persist()) };\n      });\n    }\n    let adRecs = [], adMessage = [], adCierre = \"\";\n    if(adIsResults){\n      adMessage = this.recsMessage().map(p => this.richFull(p, VIOLET));\n      adCierre = this.adCierre;\n      adRecs = this.computeRecs().map(i => {\n        const t = this.data[i], c = this.cats[t.cat].color;\n        return { title:t.title, icon:t.icon, color:c, catLabel:this.cats[t.cat].label,\n          open:() => this.openTool(i, true) };\n      });\n    }\n\n    return {\n      tools, active, modalOpen: open !== null,\n      filterChips, showAutodiag, visibleTools,\n      closeModal: () => { const slug = open!=null ? this.data[open].slug : null; if(slug && window.location.hash === \"#\"+slug) window.location.hash = \"\"; this.setState({ open:null, fromAd:false }); },\n      backToAd: () => { const slug = open!=null ? this.data[open].slug : null; if(slug && window.location.hash === \"#\"+slug) window.location.hash = \"autodiagnostico\"; this.setState({ open:null, adOpen:true, fromAd:false }); },\n      stop: (e) => e.stopPropagation(),\n      saveFicha: () => window.print(),\n      saveAd: () => window.print(),\n      foroOpen: this.state.foroOpen,\n      creaCopied: this.state.creaCopied,\n      creaNotCopied: !this.state.creaCopied,\n      openForo: () => this.setState({ foroOpen:true }),\n      closeForo: () => this.setState({ foroOpen:false }),\n      copyCrea: () => { const code = \"S38K-2MHB-SV5RS\"; let ok = false; try { const ta = document.createElement(\"textarea\"); ta.value = code; ta.setAttribute(\"readonly\", \"\"); ta.style.position = \"fixed\"; ta.style.top = \"-9999px\"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, code.length); ok = document.execCommand(\"copy\"); document.body.removeChild(ta); } catch(e) {} if (!ok && navigator.clipboard) { try { navigator.clipboard.writeText(code); } catch(e) {} } this.setState({ creaCopied:true }); setTimeout(() => this.setState({ creaCopied:false }), 1600); },\n      showBoot, bootFading,\n      adOpen, adIsQuestion, adIsResults,\n      adProgressLabel: \"Pregunta \" + (Math.min(adStep,5)+1) + \" de 6\",\n      adProgressPct: (((Math.min(adStep,6))/6)*100) + \"%\",\n      adDimension, adQuestionText, adOptions,\n      adShowBack: adStep > 0,\n      adNextLabel: adStep >= 5 ? \"Ver mi devolución\" : \"Siguiente\",\n      adNextBg: adCanNext ? VIOLET : \"#cdbcd3\",\n      adNextCursor: adCanNext ? \"pointer\" : \"not-allowed\",\n      adCtaLabel: (Object.keys(adAnswers).length >= 6) ? \"Ver mi devolución\" : \"Realizar el autodiagnóstico\",\n      adMessage, adCierre, adRecs,\n      startAd: () => { const done = Object.keys(adAnswers).length >= 6; window.location.hash = \"autodiagnostico\"; this.setState({ adOpen:true, adStep: done ? 6 : 0 }); },\n      closeAd: () => { if(window.location.hash === \"#autodiagnostico\") window.location.hash = \"\"; this.setState({ adOpen:false }); },\n      adNext: () => { if(adAnswers[adStep] === undefined) return; this.setState(s => ({ adStep: s.adStep + 1 })); },\n      adBack: () => this.setState(s => ({ adStep: Math.max(0, s.adStep - 1) })),\n      restartAd: () => this.setState({ adStep:0, adAnswers:{} }, () => this.persist()),\n      goHerramientas: () => { this.setState({ adOpen:false }); window.location.hash = \"#recursos\"; }\n    };\n  }\n}\n<\u002Fscript>\n\n\n</body></html>"</script>
